<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Going for Home</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/styles.css?v=20260216">
  <style>
    /* Admin-specific styles */
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 120px 32px 80px;
      min-height: 100vh;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
      flex-wrap: wrap;
      gap: 24px;
    }

    .admin-header h1 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.05em;
      color: var(--accent-gold);
    }

    .admin-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .admin-user {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-secondary {
      padding: 12px 24px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
    }

    .btn-secondary:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* Login form */
    .login-wrapper {
      max-width: 400px;
      margin: 120px auto;
      padding: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .login-wrapper h2 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--accent-gold);
      margin-bottom: 32px;
      text-align: center;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-error {
      color: var(--accent);
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    /* Filter controls */
    .filter-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }

    .filter-btn:hover {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }

    .filter-btn.active {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: var(--bg-dark);
    }

    /* Submissions table */
    .submissions-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 48px;
    }

    .submissions-table th,
    .submissions-table td {
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .submissions-table th {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .submissions-table td {
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .submissions-table tr:hover td {
      background: var(--bg-card);
    }

    .submissions-table tr.unread td {
      background: rgba(0, 90, 156, 0.05);
    }

    .submission-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .submission-type {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: inline-block;
    }

    .submission-type.press { border-color: var(--accent); color: var(--accent); }
    .submission-type.screenings { border-color: var(--accent-gold); color: var(--accent-gold); }
    .submission-type.general { border-color: var(--text-muted); }

    .submission-message {
      max-width: 400px;
      line-height: 1.6;
    }

    .submission-message.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .submission-actions {
      white-space: nowrap;
    }

    /* Detail Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 40px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.3s;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .modal-header {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .modal-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .modal-meta a {
      color: var(--accent-gold-light);
    }

    .modal-type {
      margin-top: 8px;
    }

    .modal-body {
      line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    .modal-actions {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    /* Make rows clickable */
    .submissions-table tbody tr {
      cursor: pointer;
    }

    .action-btn {
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }

    .action-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .action-btn.marked-read {
      border-color: var(--text-muted);
      color: var(--text-muted);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 32px;
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    /* Loading state */
    .loading-state {
      text-align: center;
      padding: 80px 32px;
      color: var(--text-muted);
    }

    /* Stats */
    .admin-stats {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-item {
      padding: 20px 28px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .stat-value {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 2rem;
      color: var(--accent-gold);
    }

    .stat-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Mobile responsive */
    @media (max-width: 900px) {
      .submissions-table th:nth-child(4),
      .submissions-table td:nth-child(4) {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .admin-container { padding: 100px 16px 60px; }
      .admin-header { flex-direction: column; align-items: flex-start; }
      .submissions-table { font-size: 0.85rem; }
      .submissions-table th, .submissions-table td { padding: 12px 8px; }
      .admin-stats { flex-wrap: wrap; }
    }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js';
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDSFqcuGBvv67zKj5LBYpQzLRf_hEo0fsg",
      authDomain: "going-for-home.firebaseapp.com",
      projectId: "going-for-home",
      storageBucket: "going-for-home.firebasestorage.app",
      messagingSenderId: "163190919110",
      appId: "1:163190919110:web:ed0ce514b42239df206cc7",
      measurementId: "G-4VV21PZC47"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAdmin = {
      auth,
      db,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      collection,
      query,
      orderBy,
      onSnapshot,
      doc,
      updateDoc
    };
  </script>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav scrolled">
    <div class="nav-inner">
      <a href="/" class="nav-logo">Going for Home</a>
      <span style="font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);">Admin</span>
    </div>
  </nav>

  <!-- Login View -->
  <div id="loginView" class="login-wrapper" style="display: none;">
    <h2>Admin Login</h2>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <p id="loginError" class="login-error"></p>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>

  <!-- Admin Dashboard View -->
  <div id="dashboardView" class="admin-container" style="display: none;">
    <header class="admin-header">
      <h1>Contact Submissions</h1>
      <div class="admin-actions">
        <span id="userEmail" class="admin-user"></span>
        <button id="logoutBtn" class="btn-secondary">Sign Out</button>
      </div>
    </header>

    <div class="admin-stats">
      <div class="stat-item">
        <div id="totalCount" class="stat-value">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-item">
        <div id="unreadCount" class="stat-value">0</div>
        <div class="stat-label">Unread</div>
      </div>
    </div>

    <div class="filter-controls">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="press">Press</button>
      <button class="filter-btn" data-filter="screenings">Screenings</button>
      <button class="filter-btn" data-filter="general">General</button>
      <button class="filter-btn" data-filter="unread">Unread Only</button>
    </div>

    <div id="loadingState" class="loading-state">
      <p>Loading submissions...</p>
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <h3>No Submissions Yet</h3>
      <p>Contact form submissions will appear here.</p>
    </div>

    <table id="submissionsTable" class="submissions-table" style="display: none;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Email</th>
          <th>Type</th>
          <th>Message</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="submissionsBody"></tbody>
    </table>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-header">
        <h3 id="modalName"></h3>
        <div class="modal-meta">
          <div><a id="modalEmail" href=""></a></div>
          <div id="modalDate"></div>
          <div class="modal-type"><span id="modalType" class="submission-type"></span></div>
        </div>
      </div>
      <div id="modalMessage" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modalReadBtn" class="action-btn" onclick="toggleReadFromModal()">Mark Read</button>
      </div>
    </div>
  </div>

  <script src="/admin.js?v=20260216"></script>
</body>
</html>
